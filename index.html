r:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;line-height:1.5}.pc{display:inline-block;min-width:32px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 0;margin:0 0 4px 4px;font-size:13px;background:var(--bg);color:var(--ink);font-family:inherit}.pc.on{background:var(--ok);color:#fff;border-color:var(--ok)}.pc.nx{border:2px solid var(--gold)}select.st{width:auto;padding:5px;font-size:13px}

<script>
var S={courses:[],lessons:[],orders:[],payments:[],expenses:[],writing:[],buys:[],plans:[],contacts:{},cprog:{},recurring:[],cfg:{head:400,hand:400}},ref=null,tab='sum',armed='',curCourse='',assets=null,busy=0,showPaid=false,showDoneO=false,showSett=false,showClosedSum=false,showOpenSum=false;
var TABS=[['sum','סיכום'],['lessons','שיעורים'],['orders','תפילין'],['write','כתיבה'],['buys','קניות'],['pay','תשלומים']];
var STAT=['הוזמן','בכתיבה','מוכן','נמסר'];
var IDS=['l_wrote','l_hours','c_new','l_course','l_name','l_date','l_price','l_topic','o_name','o_item','o_date','o_due','o_price','o_paid','o_status','p_name','p_date','p_amt','p_note'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function money(n){return '₪'+(Number(n)||0).toLocaleString('he-IL')}
function hdate(d){try{return new Intl.DateTimeFormat('he-u-ca-hebrew-nu-hebr',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}catch(e){return ''}}
function fdate(d){if(!d)return '';var p=d.split('-'),h=hdate(d);return p[2]+'.'+p[1]+'.'+p[0]+(h?' ('+h+')':'')}
function updHd(e){var sp=document.getElementById('hd_'+e.id);if(sp)sp.textContent=e.value?hdate(e.value):''}
document.addEventListener('input',function(e){if(e.target.type==='date')updHd(e.target)});
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function save(quiet){
  S.ts=Date.now();
  if(ref){try{ref.set(JSON.parse(JSON.stringify(S))).catch(function(e){toast('לא נשמר בחשבון: '+((e&&(e.message||e.code))||e))})}catch(e){toast('לא נשמר בחשבון: '+e.message)}}
  try{localStorage.setItem('sofer',JSON.stringify(S))}catch(e){toast('שגיאת שמירה במכשיר. אל תסגור לפני יצירת גיבוי: '+e.message);throw e}
  if(!quiet)render();
}
function norm(d){d=JSON.parse(JSON.stringify(d||{}));S={courses:d.courses||[],lessons:d.lessons||[],orders:d.orders||[],payments:d.payments||[],expenses:d.expenses||[],writing:d.writing||[],buys:d.buys||[],plans:d.plans||[],contacts:d.contacts||{},cprog:d.cprog||{},recurring:d.recurring||[],cfg:d.cfg||{head:400,hand:400},ts:d.ts||0}}
async function init(){
  try{
    if(window.claude){
      var u=await claude.use('user'),db=await claude.use('db');
      if(u&&db){
        var id=await u.id();
        ref=db.doc('data/users/'+id+'/state');
        ref.onSnapshot(function(s){if(s.exists){var d0=s.data();if((d0.ts||0)>=(S.ts||0))norm(d0)}else{try{var r=localStorage.getItem('sofer');if(r){norm(JSON.parse(r));ref.set(JSON.parse(JSON.stringify(S))).catch(function(){})}}catch(e){}}if(genRec())save();else render()},function(){});
      }
    }
  }catch(e){ref=null}
  try{if(window.claude)assets=await claude.use('assets')}catch(e){assets=null}
  if(!assets)assets=localAssets;
  if(!ref){try{var r=localStorage.getItem('sofer');if(r)norm(JSON.parse(r))}catch(e){}}
  if(genRec())save();else render();
  try{siteBadge()}catch(e){}
}
function updThm(){var b=document.getElementById('thm');if(b)b.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️ מצב בהיר':'🌙 מצב כהה'}
function toggleTheme(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('sofer_theme',n)}catch(e){}updThm()}
// --- תוספות: גיבוי, שחזור, וסנכרון הזמנות מהאתר ---
function siteEndpoint(){try{return localStorage.getItem('sofer_site_endpoint')||''}catch(e){return ''}}
function localImageRefs(x){var found={};function walk(v){if(typeof v==='string'&&/^idb_/.test(v))found[v]=true;else if(Array.isArray(v))v.forEach(walk);else if(v&&typeof v==='object')Object.keys(v).forEach(function(k){walk(v[k])})}walk(x);return Object.keys(found)}
async function backupData(){
  try{
    toast('מכין גיבוי…');
    var imgs={},keys=[];
    keys=await idbKeys();
    for(var i=0;i<keys.length;i++){var bl=await idbGet(keys[i]);if(!bl)throw new Error('תמונה חסרה: '+keys[i]);imgs[keys[i]]=await blobToB64(bl)}
    var refs=localImageRefs(S);for(var j=0;j<refs.length;j++){if(!imgs[refs[j]])throw new Error('תמונה מקומית חסרה: '+refs[j])}
    var raw=JSON.stringify({v:2,state:S,images:imgs});
    var blob=new Blob([raw],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='sofer-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{URL.revokeObjectURL(a.href)}catch(e){}a.remove()},500);
    toast('הגיבוי ירד ✓'+(keys.length?' כולל '+keys.length+' תמונות':'')+' — שמור במקום בטוח');
  }catch(e){toast('הגיבוי נכשל: '+e.message)}
}
function importData(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=async function(){
    try{
      var d=JSON.parse(rd.result);
      var imgs=(d&&d.images&&typeof d.images==='object')?d.images:null;
      if(d&&typeof d==='object'&&!d.orders&&!d.courses&&!d.lessons){var inner=d.state||d.data||d.sofer;if(inner&&typeof inner==='object')d=inner}
      if(!d||typeof d!=='object'||(!d.orders&&!d.courses&&!d.lessons&&!d.payments)){toast('הקובץ לא נראה כמו גיבוי של האפליקציה');inp.value='';return}
      var n=(d.orders||[]).length+(d.lessons||[]).length+(d.courses||[]).length+(d.payments||[]).length;
      var nim=imgs?Object.keys(imgs).length:0;
      if(!confirm('השחזור יחליף את כל מה שיש עכשיו באפליקציה ב-'+n+' הרשומות שבקובץ'+(nim?' (כולל '+nim+' תמונות)':'')+'. להמשיך?')){inp.value='';return}
      var refs=localImageRefs(d);for(var j=0;j<refs.length;j++){if(!imgs||!imgs[refs[j]])throw new Error('הגיבוי חסר תמונה מקומית: '+refs[j])}
      if(nim){toast('משחזר תמונות…');var ks=Object.keys(imgs);for(var i=0;i<ks.length;i++){if(!/^idb_/.test(ks[i])||typeof imgs[ks[i]]!=='string'||!/^data:[^,]*;base64,/.test(imgs[ks[i]]))throw new Error('תמונה לא תקינה בגיבוי');var rb=await fetch(imgs[ks[i]]);if(!rb.ok)throw new Error('קריאת תמונה נכשלה');var blob=await rb.blob();var existing=await idbGet(ks[i]);if(existing&&await blobToB64(existing)!==imgs[ks[i]])throw new Error('מזהה תמונה מתנגש; הנתונים לא הוחלפו');await idbPut(ks[i],blob)}}
      var previous=S;try{norm(d);localStorage.setItem('sofer',JSON.stringify(S))}catch(e){S=previous;throw e}save();toast('הנתונים שוחזרו ✓');
    }catch(e){toast('השחזור נכשל: '+e.message)}
    inp.value='';
  };
  rd.onerror=function(){toast('לא הצלחתי לקרוא את הקובץ');inp.value=''};
  rd.readAsText(f);
}
function telNum(p){return String(p||'').replace(/[^0-9+]/g,'')}
function waNum(p){var d=String(p||'').replace(/[^0-9]/g,'');if(d.indexOf('0')===0)d='972'+d.slice(1);return d}
function adminKey(){try{return localStorage.getItem('sofer_admin_key')||''}catch(e){return ''}}
function siteConnect(){document.getElementById('sbox').style.display='flex';document.getElementById('sbox_b').innerHTML='<label for="site_endpoint">כתובת החיבור (Apps Script)</label><input id="site_endpoint" type="url" autocomplete="off"><label for="admin_key">מפתח החיבור הפרטי</label><input id="admin_key" type="password" autocomplete="off"><p class="mut">מגדירים פעם אחת לאחר עדכון החיבור. לא שולחים את המפתח בצ׳אט.</p><button class="add" onclick="saveSiteKey()">שמור חיבור</button>'}
function saveSiteKey(){var ep=val('site_endpoint');if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(ep)){toast('נדרשת כתובת Apps Script תקינה');return}var k=val('admin_key');if(k.length<24){toast('נדרש מפתח פרטי באורך 24 תווים לפחות');return}try{localStorage.setItem('sofer_site_endpoint',ep);localStorage.setItem('sofer_admin_key',k);document.getElementById('admin_key').value='';siteOrders()}catch(e){toast('החיבור לא נשמר במכשיר')}}
async function adminRequest(type,params){var k=adminKey();if(!k||!siteEndpoint())throw new Error('יש להגדיר חיבור פרטי');var c=new AbortController(),t=setTimeout(function(){c.abort()},15000);try{var r=await fetch(siteEndpoint(),{method:'POST',credentials:'omit',signal:c.signal,body:new URLSearchParams(Object.assign({},params||{},{type:type,admin_key:k}))});if(!r.ok)throw new Error('network');var d=await r.json();if(!d.ok)throw new Error(d.error||'לא התקבל אישור');return d}finally{clearTimeout(t)}}
function loadPending(ok,bad){if(!adminKey()){if(bad)bad();return}adminRequest('pending').then(ok).catch(function(){if(bad)bad()})}
function siteBadge(){
  var b=document.getElementById('sitebdg');if(!b)return;
  loadPending(function(d){
    if(!d||!d.ok)return;
    var n=(d.orders||[]).length+(d.signups||[]).length;
    b.textContent=n?' ('+n+')':'';
  },function(){});
}
function siteOrders(){
  if(!adminKey()||!siteEndpoint()){siteConnect();return}
  document.getElementById('sbox').style.display='flex';
  document.getElementById('sbox_b').innerHTML='<div class="mut">טוען מהאתר…</div>';
  loadPending(function(d){
    if(!d||!d.ok){document.getElementById('sbox_b').innerHTML='<div class="mut">לא הצלחתי לקרוא מהאתר. נסה שוב עוד רגע.</div>';return}
    window._site={orders:d.orders||[],signups:d.signups||[]};
    renderSiteBox();
  },function(){document.getElementById('sbox_b').innerHTML='<div class="mut">אין חיבור לאתר כרגע. בדוק אינטרנט ונסה שוב.</div>'});
}
function siteClose(){document.getElementById('sbox').style.display='none';siteBadge()}
function renderSiteBox(){
  var d=window._site||{orders:[],signups:[]},b=document.getElementById('sbox_b'),h='';

function supplierWarnings(){var unknown=S.orders.some(function(o){return supplierCost(o).unknown.length}),overlap=S.buys.some(function(b){return b.oid&&(b.cat==='b'||b.cat==='r')&&findO(b.oid)&&supplierCost(findO(b.oid)).total});return unknown||overlap?'<div class="bad">הרווח דורש בדיקה: '+(unknown?'יש הזמנות עם סוג בתים לא ידוע. ':'')+(overlap?'יש קניית ספק שכבר רשומה בקניות.':'')+'</div>':''}
function supplierCost(o){var total=0,unknown=[],lines=[];Object.keys(o.parts||{}).forEach(function(k){var p=o.parts[k],last=k.slice(-1),amount=0,label='';if(last==='b'){if(p.type==='פרודות'){amount=1300;label='בתים פרודות'}else if(p.type==='ריבוע רגל'){amount=1500;label='בתים ריבוע רגל'}else unknown.push('סוג בתים חסר או לא מוכר')}else if(last==='r'){amount=p.up?240:180;label=p.up?'רצועות לנדא (משודרגות)':'רצועות רגילות'}if(amount){total+=amount;lines.push({key:k,label:label,amount:amount})}});return {total:total,unknown:unknown,lines:lines}}

function supplierInfo(o){var overlap=S.buys.some(function(b){return b.oid===o.id&&(b.cat==='b'||b.cat==='r')});var c=supplierCost(o);if(!c.total&&!c.unknown.length)return '';return '<div class="sub"><b>עלות ספק · הוצאה שלי '+money(c.total)+'</b>'+c.lines.map(function(x){return '<div class="mut">'+esc(x.label)+' · '+money(x.amount)+'</div>'}).join('')+(c.unknown.length?'<div class="bad">עלות לא מלאה: '+esc(c.unknown.join(', '))+'</div>':'')+(overlap?'<div class="bad">בדיקת כפל נדרשת: יש גם קניית בתים/רצועות משויכת. הרווח דורש בדיקה לפני שימוש.</div>':'')+'<div class="mut">נכללת ברווח בפוטנציאל לכל ההזמנות. מחיר הלקוח לא משתנה. לא לרשום את אותה עלות שוב בקניות.</div><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" '+((Number(o.supplierPaidAmount)||0)>=c.total&&c.total>0?'checked ':'')+'onchange="setSupplierPaid('+o.id+',this.checked)">שילמתי לספק את העלות הזו (תזרים בפועל)</label></div>'}
function proofAmount(o){return o&&o.proofreading?Number(o.proofreading.amount)||0:0}
function proofPaid(o){return Math.min(proofAmount(o),Math.max(0,Number(o&&o.proofreading&&o.proofreading.paid)||0))}

function setProofPaid(id,yes){var o=findO(id);if(!o||!o.proofreading)return;var previous=o.proofreading.paid;o.proofreading.paid=yes?proofAmount(o):0;try{save()}catch(e){o.proofreading.paid=previous;render()}}
function proofOrderInfo(o){if(!proofAmount(o))return '';return '<div class="sub"><b>הגהה · הוצאה שלי '+money(proofAmount(o))+'</b><div class="mut">כלולה בחישוב הרווח, לא תוספת לחיוב הלקוח. לא לרשום שוב בקניות.</div><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" '+(proofPaid(o)?'checked ':'')+'onchange="setProofPaid('+o.id+',this.checked)">שילמתי למגיה (תזרים בפועל)</label></div>'}
function updateProofPreview(){var e=document.getElementById('o_proof_preview');if(!e)return;var n=0;PAIRS.forEach(function(pr){var k=pr[0]+'p',p=document.getElementById('pt_'+k),s=document.getElementById('ps_'+k);if(p&&p.checked&&s&&s.checked)n++});e.textContent=editId?'הזמנה קיימת: עלות הגהה לא נוספת ולא מחושבת מחדש אוטומטית.':n?'הגהה: הוצאה שלי '+money(n*200)+' ('+n+' × 200 ₪). בתוספת המכירה העצמית נשארים '+money(n*600)+' אחרי הגהה. מחיר הלקוח לא משתנה; תשלום למגיה מסמנים בנפרד.':'בהזמנה חדשה עם מכירה עצמית: 200 ₪ להגהה לכל זוג פרשיות, מתוך התוספת של 800 ₪.'}
function sellQ(k){var q=document.getElementById('ps_'+k),e=document.getElementById('pp_'+k);if(!q||!e)return;e.value=q.checked?3800:3000;var c=document.getElementById('pt_'+k);if(c)c.checked=true;calcTotal()}
function brkFee(x){if(!x.brk)return 0;return x.brkAmt!=null?(Number(x.brkAmt)||0):Math.round((x.price||0)*0.08)}
function owed(x){return (x.price||0)+brkFee(x)+(x.svc||0)}
function calcTotal(){updateProofPreview();var t=0;PAIRS.forEach(function(pr){PARTS.forEach(function(p){var k=pr[0]+p[0],c=document.getElementById('pt_'+k);if(c&&c.checked)t+=Number(val('pp_'+k))||0})});for(var i=0;i<exN;i++)t+=Number(val('ex_a'+i))||0;var e=document.getElementById('o_total');if(e)e.textContent=money(t);var b=document.getElementById('o_brk'),f=b&&b.checked?(Number(val('o_brka'))||0):0,a=document.getElementById('o_brkamt'),n=document.getElementById('o_net');if(a)a.textContent=money(f);if(n)n.textContent=money(t+f+(Number(val('o_svc'))||0));var et=document.getElementById('o_eta');if(et){var np=0;PAIRS.forEach(function(pr){var c=document.getElementById('pt_'+pr[0]+'p');if(c&&c.checked)np++});if(!np||editId)et.textContent='';else{var av=availInfo(np);et.textContent=av.status==='ok'?'סיום משוער לפי הקצב: '+gd(av.date):(av.status==='over'?'הקצב לא מספיק לתכנון, ראה לשונית כתיבה':'')}}return t}
function allPair(k){PARTS.forEach(function(p){var c=document.getElementById('pt_'+k+p[0]);if(c)c.checked=true});calcTotal()}
function setPart(id,k,v){S.orders.forEach(function(o){if(o.id===id&&o.parts&&o.parts[k])o.parts[k].ok=v});save()}
function chip(x,k,label){var q=x.parts[k];return '<label class="chip"><input type="checkbox" style="width:auto" '+(q.ok?'checked ':'')+'onchange="setPart('+x.id+',\''+k+'\',this.checked)"> '+label+(q.up?' משודרגות':'')+(q.self?' מכירה עצמית':'')+(q.type?' · '+q.type:'')+(q.price?' · '+money(q.price):'')+(q.note?' · '+esc(q.note):'')+'</label>'}
function partsRow(x){
  var h='',old=PARTS.filter(function(p){return x.parts&&x.parts[p[0]]});
  if(old.length)h+='<div>'+old.map(function(p){return chip(x,p[0],p[1])}).join('')+'</div>';
  PAIRS.forEach(function(pr){
    var ks=PARTS.filter(function(p){return x.parts&&x.parts[pr[0]+p[0]]});

  });

var curW='';
function fmtL(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function isoAdd(n){var d=new Date();d.setDate(d.getDate()+n);return fmtL(d)}
function hasPar(o,k){return !!(o.parts&&o.parts[k+'p'])}
function sumW(oid,pair,part){return S.writing.filter(function(w){return w.oid===oid&&w.pair===pair&&w.part===part}).reduce(function(a,w){return a+w.words},0)}
function progressHtml(o,k){
  var hd=sumW(o.id,k,'h'),hn=sumW(o.id,k,'y'),th=S.cfg.head||400,ty=S.cfg.hand||400;
  function bar(l,v,t){var pc=Math.min(100,Math.round(v/t*100));return '<div class="mut">'+l+' '+v+'/'+t+' ('+pc+'%)</div><div class="pb'+(v>=t?' done':'')+'"><i style="width:'+pc+'%"></i></div>'}
  return '<div class="wp">'+bar('ראש',hd,th)+bar('יד',hn,ty)+(hd>=th&&hn>=ty?'<span class="ok">✓ כתיבת הפרשיות הושלמה</span>':'')+'</div>';
}
function pickW(v){curW=v;render()}
function setCfg(){S.cfg.head=Number(val('cfg_h'))||400;S.cfg.hand=Number(val('cfg_y'))||400;save()}
function addW(){
  var oid=Number(val('w_order')),w=Number(val('w_words'));
  if(!oid||!val('w_pair')){toast('בחר הזמנה');return}
  if(!(w>0)){toast('כתוב כמה מילים כתבת');return}
  S.writing.unshift({id:Date.now(),date:val('w_date')||today(),oid:oid,pair:val('w_pair'),part:val('w_part')||'h',words:Math.round(w)});
  var e=document.getElementById('w_words');if(e)e.value='';
  save();toast('נרשם ✓ · '+Math.round(w)+' מילים');
}
function delW(id){arm('w'+id,function(){S.writing=S.writing.filter(function(w){return w.id!==id})})}
function viewWriteActive(){
  var el=S.orders.filter(function(o){return o.status!=='נמסר'&&writingRemaining(o)>0&&(hasPar(o,'r')||hasPar(o,'t'))});
  if(!el.length)return availCard()+recPace()+'<div class="card"><div class="empty">אין הזמנות עם פרשיות פתוחות. כשתסמן פרשיות בהזמנת תפילין, תוכל לעקוב כאן אחרי הכתיבה.</div></div>';
  var co=findO(Number(curW));if(!co||el.indexOf(co)<0)co=el[0];curW=String(co.id);
  var pairs=PAIRS.filter(function(pr){return hasPar(co,pr[0])});
  var t0=today(),from=isoAdd(-6);
  var tw=S.writing.filter(function(w){return w.date===t0}).reduce(function(a,w){return a+w.words},0);
  var w7=S.writing.filter(function(w){return w.date>=from&&w.date<=t0}).reduce(function(a,w){return a+w.words},0);
  var avg=Math.round(w7/7);
  var h='<div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><span class="mut">כתבתי היום</span><b>'+tw+'</b></div><div class="stat"><span class="mut">ממוצע יומי (7 ימים)</span><b>'+avg+'</b></div></div>';
  h+=recPace();
  h+=availCard();
  h+='<div class="card"><b>רישום כתיבה</b><div class="grid" style="margin-top:8px"><div class="full"><label for="w_order">הזמנה</label><select id="w_order" onchange="pickW(this.value)">'+el.map(function(o){return '<option value="'+o.id+'"'+(o.id===co.id?' selected':'')+'>'+esc(o.name)+(o.item?' · '+esc(o.item):'')+'</option>'}).join('')+'</select></div>'+
  '<div><label for="w_pair">זוג</label><select id="w_pair">'+pairs.map(function(pr){return '<option value="'+pr[0]+'">'+pr[1].replace('תפילין ','')+'</option>'}).join('')+'</select></div>'+
  '<div><label for="w_part">חלק</label><select id="w_part"><option value="h">ראש</option><option value="y">יד</option></select></div>'+
  field('w_date','תאריך','date','value="'+today()+'"')+field('w_words','כמה מילים כתבת','number','inputmode="numeric"')+
  '</div><button class="add" onclick="addW()">רשום כתיבה</button>'+
  '<div class="mut" style="margin-top:8px">יעד לכל זוג: ראש <input class="paid" id="cfg_h" type="number" value="'+(S.cfg.head||400)+'" onchange="setCfg()"> יד <input class="paid" id="cfg_y" type="number" value="'+(S.cfg.hand||400)+'" onchange="setCfg()"> מילים</div></div>';
  var items=[];
  el.forEach(function(o){PAIRS.forEach(function(pr){if(hasPar(o,pr[0])){
    var rem=Math.max(0,(S.cfg.head||400)-sumW(o.id,pr[0],'h'))+Math.max(0,(S.cfg.hand||400)-sumW(o.id,pr[0],'y'));
    items.push({o:o,k:pr[0],lab:pr[1].replace('תפילין ',''),rem:rem})}})});
  items.sort(function(a,b){var da=a.o.due||'9999',db=b.o.due||'9999';return da<db?-1:da>db?1:a.o.id-b.o.id});
  var cum=0;
  items.forEach(function(it){
    cum+=it.rem;
    var eta='';
    if(it.rem>0&&avg>0){var dt=isoAdd(Math.ceil(cum/avg)),late=it.o.due&&dt>it.o.due;eta=' · סיום משוער <span class="'+(late?'bad':'')+'">'+fdate(dt)+(late?' (אחרי היעד)':'')+'</span>'}
    h+='<div class="card"><b>'+esc(it.o.name)+'</b> <span class="mut">'+it.lab+(it.o.due?' · יעד '+fdate(it.o.due):'')+'</span>'+progressHtml(it.o,it.k)+(it.rem>0?'<div class="mut">נשארו '+it.rem+' מילים'+eta+'</div>':'')+'</div>';
  });
  var log=S.writing.filter(function(w){var o=findO(w.oid);return o&&o.status!=='נמסר'&&writingRemaining(o)>0}).slice(0,30);
  h+='<div class="card"><b>יומן כתיבה</b>'+(log.length?log.map(function(w){var o=findO(w.oid);return '<div class="row"><div><b>'+w.words+' מילים</b><span class="mut">'+fdate(w.date)+' · '+esc(o.name)+' · '+(w.pair==='t'?'ר״ת':'רש״י')+' · '+(w.part==='h'?'ראש':'יד')+'</span></div>'+xb('w'+w.id,'delW('+w.id+')','מחק')+'</div>'}).join(''):'<div class="empty">עוד לא נרשמה כתיבה</div>')+'</div>';
  return h;
}
function writingRemaining(o){var n=0;PAIRS.forEach(function(pr){if(hasPar(o,pr[0]))n+=Math.max(0,(S.cfg.head||400)-sumW(o.id,pr[0],'h'))+Math.max(0,(S.cfg.hand||400)-sumW(o.id,pr[0],'y'))});return n}
function writingClosed(o){return (hasPar(o,'r')||hasPar(o,'t'))&&(o.status==='נמסר'||writingRemaining(o)===0)}
function viewWrite(){
 var h=viewWriteActive(),done=S.orders.filter(writingClosed);
 h+='<div class="card" data-section-title="ארכיון כתיבה" data-section-count="'+done.length+'"><b>ארכיון כתיבה ('+done.length+')</b><p class="mut">הזמנות שנמסרו או שהגיעו ליעד המילים שהוגדר. הגעה ליעד מילים אינה אישור מסירה או תשלום.</p>';
 h+=done.map(function(o){return '<div class="sub"><b>'+esc(o.name)+'</b><span class="mut">'+(o.status==='נמסר'?'נמסר':'יעד הכתיבה הושלם')+'</span>'+PAIRS.filter(function(pr){return hasPar(o,pr[0])}).map(function(pr){return progressHtml(o,pr[0])}).join('')+'<button class="x" onclick="editOrder('+o.id+')">פתח הזמנה</button></div>'}).join('');
 var logs=S.writing.filter(function(w){var o=findO(w.oid);return o&&writingClosed(o)});
 h+='<details><summary>רישומי כתיבה בארכיון ('+logs.length+')</summary>'+logs.map(function(w){var o=findO(w.oid);return '<div class="row"><span>'+esc(o.name)+' · '+fdate(w.date)+' · '+w.words+' מילים</span>'+xb('w'+w.id,'delW('+w.id+')','מחק')+'</div>'}).join('')+'</details></div>';
 return h;
}

function genRec(){
  var ch=false,t0=today();
  (S.recurring||[]).forEach(function(t){
    if(t.off)return;
    var cur=t.next||t.first,guard=0,cnt=t.count||52;
    while(cur<=t0&&guard++<120){
      var idx=Math.round((dayNum(cur)-dayNum(t.first))/7);
      if(idx>=cnt)break;
      if(makeRecOrder(t,cur,idx))ch=true;
      cur=addDaysIso(cur,7);
    }
    if(t.next!==cur){t.next=cur;ch=true}
  });
  return ch;
}

  '<div class="full"><label>מה כלול בכל הזמנה (מחיר לרכיב)</label>'+PARTS.map(function(p){return '<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px"><label style="display:flex;gap:4px;align-items:center;width:130px;margin:0;font-size:14px;color:var(--ink)"><input type="checkbox" id="rc_c_'+p[0]+'" style="width:auto"'+(p[0]==='p'?' checked':'')+'> '+p[1]+'</label><input id="rc_p_'+p[0]+'" type="number" inputmode="decimal" value="'+DEF[p[0]]+'" style="width:100px"></div>'}).join('')+'</div></div><button class="add" onclick="addRec()">הוסף הזמנה קבועה</button><div class="mut" style="margin-top:6px">ההזמנה נוצרת כשהאפליקציה נפתחת ביום שקבעת או אחריו. בלי תיווך ובלי תוספות, ואפשר לערוך כל הזמנה אחרי שנוצרה.</div></div>';
  return h+'</div>';
}
var stuName='';
function allStudents(){var m={};S.courses.forEach(function(c){c.students.forEach(function(n){m[n]=1})});S.lessons.forEach(function(l){if(!l.all&&l.name)m[l.name]=1});return Object.keys(m).sort()}
function stuCard(){return '<div class="card"><b>תיק תלמיד</b> <span class="mut">כל מה שכתב, לפי תאריך</span><select id="st_pick" onchange="if(this.value)openStu(this.value)" style="margin-top:6px"><option value="">בחר תלמיד…</option>'+allStudents().map(function(n){return '<option>'+esc(n)+'</option>'}).join('')+'</select></div>'}
function openStuC(cid,i){var c=course(cid);if(c)openStu(c.students[i])}
function openStu(n){stuName=n;document.getElementById('stu').style.display='flex';stuRender();var p=document.getElementById('st_pick');if(p)p.value=''}
function stuClose(){document.getElementById('stu').style.display='none'}
function stuEntries(n){
  var out=[];
  S.lessons.forEach(function(l){
    var c=course(l.course),cn=c?c.name:'';
    if(!l.all&&l.name===n)out.push({d:l.date,cn:cn,t:l.topic,w:l.wrote||'',im:l.imgs||[]});
    else if(l.all&&((c&&c.students.indexOf(n)>-1)||(l.stu&&l.stu[n]))){var q=(l.stu&&l.stu[n])||{};out.push({d:l.date,cn:cn,t:l.topic,w:q.wrote||'',im:q.imgs||[],g:true})}
  });
  out.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
  return out;
}
function stuRender(){
  var n=stuName,all=stuEntries(n),only=document.getElementById('stu_f').checked;
  var list=only?all.filter(function(e){return e.w||e.im.length}):all;
  var photos=all.reduce(function(a,e){return a+e.im.length},0);
  document.getElementById('stu_t').textContent='תיק תלמיד · '+n;
  var h='<div class="mut">'+all.length+' שיעורים · '+photos+' תמונות</div>';
  h+=list.length?list.map(function(e){
    return '<div class="row" style="display:block"><b>'+fdate(e.d)+'</b> <span class="mut">'+(e.cn?esc(e.cn)+' · ':'')+(e.g?'שיעור קבוצתי · ':'')+(e.t?esc(e.t):'')+'</span>'+(e.w?'<div style="white-space:pre-wrap;margin-top:2px">'+esc(e.w)+'</div>':'')+(e.im.length?'<div>'+e.im.map(function(id){return '<span class="th"><img data-iid="'+id+'" src="'+(isLocalImg(id)?'':'/_blob/'+id)+'" alt="" onclick="showImg(\''+id+'\')"></span>'}).join('')+'</div>':'')+'</div>';
  }).join(''):'<div class="empty">'+(all.length?'עדיין אין כתיבה או תמונות. הסר את הסימון למעלה כדי לראות את כל השיעורים.':'אין שיעורים לתלמיד הזה')+'</div>';
  document.getElementById('stu_b').innerHTML=h;hydrateImgs();
}
function recWeekly(){
  var w=0,hd=S.cfg.head||400,hn=S.cfg.hand||400;
  (S.recurring||[]).forEach(function(t){
    if(t.off||!t.parts||t.parts.p===undefined)return;
    var nx=t.next||t.first,idx=Math.round((dayNum(nx)-dayNum(t.first))/7);
    if(idx<(t.count||52))w+=hd+hn;
  });
  return w;
}
function backlogWords(){
  var rem=0,hd=S.cfg.head||400,hn=S.cfg.hand||400;
  S.orders.forEach(function(o){if(o.status==='נמסר')return;PAIRS.forEach(function(pr){if(hasPar(o,pr[0]))rem+=Math.max(0,hd-sumW(o.id,pr[0],'h'))+Math.max(0,hn-sumW(o.id,pr[0],'y'))})});
  return rem;
}
function avgPace(){var t0=today(),from=isoAdd(-6);return S.writing.filter(function(w){return w.date>=from&&w.date<=t0}).reduce(function(a,w){return a+w.words},0)/7}
function availInfo(np){
  var avg=avgPace(),plan=Number(S.cfg.plan)||0,pace=plan>0?plan:avg,recW=recWeekly(),rec=recW/7,B=backlogWords(),W=np*((S.cfg.head||400)+(S.cfg.hand||400));
  var r={avg:avg,plan:plan,pace:pace,recW:recW,B:B,W:W,net:pace-rec};
  if(pace<=0){r.status='nopace';return r}
  if(r.net<=0){r.status='over';return r}
  r.days=Math.max(1,Math.ceil((B+W)/r.net-1e-9));r.date=isoAdd(r.days);r.status='ok';
  return r;
}
function setPlanPace(){S.cfg.plan=Number(val('av_pace'))||0;save()}
function availCard(){
  var np=Number(val('av_pairs'))||1,a=availInfo(np);
  var h='<div class="card"><b>מתי אני פנוי להזמנה חדשה?</b><div class="grid" style="margin-top:8px"><div><label for="av_pairs">כמה זוגות פרשיות</label><select id="av_pairs" onchange="render()"><option value="1">זוג אחד</option><option value="2">שני זוגות (רש״י + ר״ת)</option></select></div><div><label for="av_pace">קצב לתכנון, מילים ביום</label><input id="av_pace" type="number" inputmode="numeric" value="'+(a.plan||'')+'" placeholder="'+Math.round(a.avg)+'" onchange="setPlanPace()"></div></div>';
  h+='<div class="row"><span>קצב בפועל, 7 ימים אחרונים</span><span class="amt">'+Math.round(a.avg)+' ליום</span></div>';
  h+='<div class="row"><span>נשארו בהזמנות פתוחות</span><span class="amt">'+a.B+' מילים</span></div>';
  if(a.recW)h+='<div class="row"><span>הזמנות קבועות לוקחות</span><span class="amt">'+a.recW+' בשבוע</span></div>';
  h+='<div class="row"><span>הזמנה חדשה</span><span class="amt">'+a.W+' מילים</span></div>';
  if(a.status==='ok')h+='<div class="row"><b>סיום משוער</b><b class="amt ok" style="font-size:18px">'+fdate(a.date)+'</b></div><div class="mut">בערך '+a.days+' ימים מהיום. כדאי להוסיף מרווח ביטחון.</div>';
  else if(a.status==='over')h+='<div class="bad" style="margin-top:6px">הקצב לתכנון ('+Math.round(a.pace)+' ביום) לא מספיק אפילו להזמנות הקבועות ('+Math.ceil(a.recW/7)+' ביום). צריך להעלות קצב או להשהות הזמנה קבועה.</div>';
  else h+='<div class="mut" style="margin-top:6px">עוד אין נתוני כתיבה מ־7 הימים האחרונים. כתוב קצב לתכנון בשדה למעלה כדי לראות תאריך.</div>';
  return h+'</div>';
}
function viewOrders(){
  if(editId&&!findO(editId)){editId=null;exN=1}
  var h='<div class="card"><p class="mut">📷 שומרים את ההזמנה, ואז מוסיפים תמונות או מצלמים בכרטיס שלה, תחת תיעוד מה שיצא.</p>'+(editId?'<div class="mut" style="margin-bottom:6px">✏️ עריכת הזמנה: <b>'+esc(findO(editId).name)+'</b></div>':'')+'<div class="grid">'+field('o_name','שם המזמין','text','list="ol"','full')+field('o_email','מייל הלקוח (לא חובה, לשליחת חשבונית)','email','inputmode="email"','full')+field('o_item','מה הוזמן','text','placeholder="למשל תפילין פשוטות"','full')+partsForm()+field('o_date','תאריך הזמנה','date','value="'+today()+'"')+field('o_due','יעד סיום','date')+field('o_paid','שולם עד כה ₪','number','inputmode="decimal"')+'<div class="full"><label for="o_status">סטטוס</label><select id="o_status">'+STAT.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></div></div><button class="add" onclick="add(\'orders\')">'+(editId?'שמור שינויים':'הוסף הזמנה')+'</button>'+(editId?'<button class="x" onclick="cancelEdit()">בטל עריכה</button>':'')+'</div>';
  h+=recCard();
  h+='<div class="card">';
  var ordRow=function(x){
    var left=owed(x)-(x.paid||0);
    return '<div class="row"><div><b>'+esc(x.name)+'</b><span class="mut">'+(x.item?esc(x.item)+' · ':'')+'הוזמן '+fdate(x.date)+dueTag(x)+'</span>'+
    (x.rid?'<span class="mut">🔁 הזמנה קבועה</span>':'')+(x.email?'<span class="mut">✉️ '+esc(x.email)+'</span>':'')+(x.phone?'<span class="mut">📞 <a href="tel:'+telNum(x.phone)+'">'+esc(x.phone)+'</a> · <a target="_blank" rel="noopener" href="https://wa.me/'+waNum(x.phone)+'">וואטסאפ</a></span>':'')+(x.note?'<span class="mut">'+esc(x.note)+'</span>':'')+(x.adj?'<span class="mut">'+(x.adj>0?'תוספת ':'הנחה ')+money(Math.abs(x.adj))+'</span>':'')+(x.extras||[]).map(function(e){return '<span class="mut">'+esc(e.l||(e.a>0?'תוספת':'הנחה'))+' '+moneyS(e.a)+'</span>'}).join('')+'<span class="mut">סך הכל '+money(owed(x))+' · שולם '+money(x.paid)+' · <span class="'+(left>0?'bad':'ok')+'">'+(left>0?'נשאר '+money(left):'שולם במלואו')+'</span></span>'+
    (x.svc?'<span class="mut">עמלת תיווך שלי '+money(x.svc)+'</span>':'')+(x.brk?'<span class="mut">מתוכו עמלת המתווך '+money(brkFee(x))+(x.brkn?' · '+esc(x.brkn):'')+' · לי '+money(x.price+(x.svc||0))+'</span>':'')+(buyTot(x.id)?'<span class="mut">קניות להזמנה '+money(buyTot(x.id))+' · יתרה אחרי קניות, ספק והגהה '+moneyS(x.price-buyTot(x.id)-proofAmount(x)-supplierCost(x).total)+'</span>':'')+partsRow(x)+supplierInfo(x)+proofOrderInfo(x)+docBlock(x)+'<div style="display:flex;gap:6px;margin-top:4px;align-items:center"><select class="st" onchange="setStatus('+x.id+',this.value)">'+STAT.map(function(s){return '<option'+(s===x.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
    '<input class="paid" type="number" inputmode="decimal" placeholder="עדכן שולם" onchange="setPaid('+x.id+',this.value)"></div></div>'+
    '<div style="text-align:left"><span class="amt">'+money(owed(x))+'</span><br><button class="x" onclick="editOrder('+x.id+')">✏️ ערוך</button><br><button class="x" onclick="invOrder('+x.id+')">🧾 חשבונית</button><br>'+delBtn('orders',x.id)+'</div></div>'};
  var groups=[['הוזמן','הזמנות חדשות'],['בכתיבה','הזמנות בכתיבה'],['מוכן','מוכנות למסירה'],['deliveredDue','נמסרו - יתרה לבדיקה'],['settled','נמסרו ושולמו']];
  h+=groups.map(function(g){var list=S.orders.filter(function(x){var done=x.status==='נמסר',due=owed(x)-(x.paid||0);return g[0]==='settled'?done&&due<=0:g[0]==='deliveredDue'?done&&due>0:x.status===g[0]});return '<details class="order-group"><summary>'+g[1]+' ('+list.length+')</summary>'+list.map(ordRow).join('')+'</details>'}).join('');
  return h+'</div>';
}
function viewPay(){
  var h='<div class="card"><div class="grid">'+field('p_name','שולם על ידי','text','list="al"','full')+field('p_date','תאריך','date','value="'+today()+'"')+field('p_amt','סכום ₪','number','inputmode="decimal"')+'<div class="full"><label for="p_for">עבור</label><select id="p_for"><option value="o">תפילין</option><option value="l">שיעורים</option></select></div>'+field('p_note','הערה (מזומן, ביט, העברה…)','text','','full')+'</div><button class="add" onclick="add(\'payments\')">הוסף תשלום</button></div>';
  h+='<div class="card">';
  h+=S.payments.length?S.payments.map(function(x){return '<div class="row"><div><b>'+esc(x.name)+'</b><span class="mut">'+fdate(x.date)+' · '+(x.for==='l'?'שיעורים':'תפילין')+(x.note?' · '+esc(x.note):'')+'</span></div><div style="text-align:left"><span class="amt ok">'+money(x.amount)+'</span><br>'+delBtn('payments',x.id)+'</div></div>'}).join(''):'<div class="empty">עוד לא נרשמו תשלומים</div>';
  return h+'</div>';
}

var sectionOpen={};
function quietSections(){
 var app=document.getElementById('app');
 Array.from(app.children).filter(function(e){return e.classList.contains('card')}).forEach(function(card,i){
  var key=tab+':'+i,title='פרטים',count=null;
  var b=card.querySelector('b');if(b)title=b.textContent;
  if(tab==='orders'){
   if(i===0)title=editId?'עריכת הזמנה':'הזמנה חדשה';
   else if(card.querySelector('.order-group')){title='הזמנות לפי מצב';count=S.orders.length}
   else title='הזמנות קבועות';
  }
  if(tab==='lessons'){
   if(i===0){title='קורסים';count=S.courses.length}
   if(card.querySelector('#st_pick')){title='תיקי תלמידים';count=allStudents().length}
   if(card.querySelector('#l_course'))title='רישום שיעור חדש';
  }
  if(card.dataset.sectionTitle){title=card.dataset.sectionTitle;count=Number(card.dataset.sectionCount)||0}
  var d=document.createElement('details');d.className='section-fold';d.dataset.foldKey=key;
  var sm=document.createElement('summary');sm.textContent=title+(count!==null?' ('+count+')':'');d.appendChild(sm);
  var body=document.createElement('div');body.className='fold-body';while(card.firstChild)body.appendChild(card.firstChild);d.appendChild(body);card.appendChild(d);
  if(sectionOpen[tab]===key||(tab==='orders'&&i===0&&editId)){d.open=true;sectionOpen[tab]=key}
  d.addEventListener('toggle',function(){if(!d.isConnected)return;if(d.open){sectionOpen[tab]=key;app.querySelectorAll('details.section-fold').forEach(function(other){if(other!==d)other.open=false});hydrateImgs()}else if(sectionOpen[tab]===key)delete sectionOpen[tab]});
 });
 // Only one order-state group open inside its parent.
 app.querySelectorAll('details.order-group').forEach(function(d){d.addEventListener('toggle',function(){if(d.open)app.querySelectorAll('details.order-group').forEach(function(o){if(o!==d)o.open=false})})});
}
function render(){
  var keep={};
  document.querySelectorAll('#app input[id],#app select[id],#app textarea[id]').forEach(function(e){keep[e.id]=e.type==='checkbox'?e.checked:e.value});
  var ae=document.activeElement,aid=ae&&ae.id;
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  var v={sum:viewSum,lessons:viewLessons,orders:viewOrders,write:viewWrite,buys:viewBuys,pay:viewPay}[tab]();
  document.getElementById('app').innerHTML=names()+v;quietSections();
  setTimeout(calcTotal,0);
  setTimeout(hydrateImgs,0);
  for(var k in keep){var e=document.getElementById(k);if(e&&k!=='l_course'&&k!=='w_order'){if(e.type==='checkbox')e.checked=keep[k];else e.value=keep[k]}}
  document.querySelectorAll('#app input[type=date]').forEach(updHd);
  var t=document.getElementById('today');if(t)t.textContent=hdate(today());
  updThm();
}
init();
</script>
